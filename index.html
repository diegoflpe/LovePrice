<!DOCTYPE html> <html lang="pt-BR"> <head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- PWA -->
<meta name="theme-color" content="#ffffff">

<link rel="manifest" href="./manifest.json">

<link rel="apple-touch-icon" href="./icons/icon-192.png">

<!-- iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Love Price 💝💸">

<title>Love Price 💝💸</title>

<style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f7f7f9;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "SF Pro Display",
            "SF Pro Text",
            Helvetica,
            Arial,
            sans-serif;
    }


    /* =========================================================
       APLICAÇÃO
    ========================================================= */

    .app {
        position: fixed;
        inset: 0;

        display: flex;
        flex-direction: column;

        background: #f7f7f9;

        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {

        height: 58px;
        min-height: 58px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 16px;

        background: rgba(255, 255, 255, 0.94);

        border-bottom: 1px solid rgba(0, 0, 0, 0.08);

        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        z-index: 10;
    }


    /* =========================================================
       TÍTULO
    ========================================================= */

    .brand {

        display: flex;
        align-items: center;

        gap: 9px;

        min-width: 0;
    }


    .logo {

        width: 34px;
        height: 34px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #ff4f81,
            #ff6b9a
        );

        box-shadow:
            0 3px 8px rgba(255, 79, 129, 0.25);

        font-size: 18px;

        flex-shrink: 0;
    }


    .title-container {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }


    .title {

        font-size: 17px;
        font-weight: 700;

        color: #1c1c1e;

        line-height: 20px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }


    .subtitle {

        font-size: 11px;

        color: #8e8e93;

        line-height: 14px;
    }


    /* =========================================================
       BOTÃO ATUALIZAR
    ========================================================= */

    .refresh-button {

        width: 38px;
        height: 38px;

        border: 0;

        border-radius: 50%;

        background: #f2f2f7;

        color: #ff4f81;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            background 0.2s ease;
    }


    .refresh-button:active {

        transform: scale(0.88);

        background: #e5e5ea;
    }


    .refresh-button.loading {

        animation: spin 0.8s linear infinite;
    }


    @keyframes spin {

        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }

    }


    /* =========================================================
       ÁREA DA PLANILHA
    ========================================================= */

    .content {

        position: relative;

        flex: 1;

        width: 100%;

        overflow: hidden;

        background: #ffffff;
    }


    .spreadsheet {

        width: 100%;
        height: 100%;

        border: 0;

        display: block;

        background: white;
    }


    /* =========================================================
       LOADING
    ========================================================= */

    .loading-screen {

        position: absolute;

        inset: 0;

        z-index: 5;

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;

        background: #ffffff;

        transition:
            opacity 0.35s ease,
            visibility 0.35s ease;
    }


    .loading-screen.hidden {

        opacity: 0;

        visibility: hidden;

        pointer-events: none;
    }


    .loading-logo {

        width: 64px;
        height: 64px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 18px;

        background: linear-gradient(
            135deg,
            #ff4f81,
            #ff6b9a
        );

        box-shadow:
            0 8px 25px rgba(255, 79, 129, 0.25);

        font-size: 32px;

        margin-bottom: 18px;

        animation: pulse 1.5s ease-in-out infinite;
    }


    .loading-title {

        font-size: 20px;

        font-weight: 700;

        color: #1c1c1e;

        margin-bottom: 6px;
    }


    .loading-text {

        font-size: 14px;

        color: #8e8e93;
    }


    .spinner {

        width: 24px;
        height: 24px;

        margin-top: 18px;

        border-radius: 50%;

        border: 3px solid #f2f2f7;

        border-top-color: #ff4f81;

        animation: spin 0.8s linear infinite;
    }


    @keyframes pulse {

        0%,
        100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.05);
        }

    }


    /* =========================================================
       STATUS
    ========================================================= */

    .status {

        position: absolute;

        left: 50%;

        bottom: 16px;

        transform: translateX(-50%);

        z-index: 20;

        padding: 8px 14px;

        border-radius: 20px;

        background: rgba(28, 28, 30, 0.88);

        color: white;

        font-size: 12px;

        font-weight: 500;

        opacity: 0;

        pointer-events: none;

        transition: opacity 0.25s ease;

        white-space: nowrap;
    }


    .status.show {
        opacity: 1;
    }


    /* =========================================================
       IPHONE PEQUENO
    ========================================================= */

    @media (max-width: 380px) {

        .header {
            padding: 0 12px;
        }

        .title {
            font-size: 16px;
        }

    }

</style>

</head> <body> <div class="app">
<!-- =========================================================
     HEADER
========================================================== -->

<header class="header">

    <div class="brand">

        <div class="logo">
            💝
        </div>

        <div class="title-container">

            <div class="title">
                Love Price 💝💸
            </div>

            <div class="subtitle">
                Controle financeiro
            </div>

        </div>

    </div>


    <button
        class="refresh-button"
        id="refreshButton"
        aria-label="Atualizar aplicativo"
        onclick="refreshSpreadsheet()">

        ↻

    </button>

</header>


<!-- =========================================================
     CONTEÚDO
========================================================== -->

<main class="content">


    <!-- Tela de carregamento -->

    <div
        class="loading-screen"
        id="loadingScreen">

        <div class="loading-logo">
            💝
        </div>

        <div class="loading-title">
            Love Price 💝💸
        </div>

        <div class="loading-text">
            Carregando seu aplicativo...
        </div>

        <div class="spinner"></div>

    </div>


    <!-- Planilha -->

    <iframe
        id="spreadsheet"
        class="spreadsheet"

        src="https://1drv.ms/x/c/762904bb730f7dc5/IQRnQPaHajJ9SZ-4F6AKAe2TAYpW60J1d1Lp4v_loGXIn9M?wdAllowInteractivity=False&AllowTyping=True&ActiveCell='Mobile'!D6&Item='Mobile'!A1%3AG76&wdHideGridlines=True&wdHideHeaders=True&wdInConfigurator=True"

        frameborder="0"
        scrolling="no">

    </iframe>


    <!-- Mensagem de status -->

    <div
        class="status"
        id="status">

        Aplicativo atualizado

    </div>


</main>

</div> <script> /* ========================================================= ELEMENTOS ========================================================= */ const iframe = document.getElementById("spreadsheet"); const loadingScreen = document.getElementById("loadingScreen"); const refreshButton = document.getElementById("refreshButton"); const status = document.getElementById("status"); /* ========================================================= ESCONDER LOADING QUANDO O EXCEL CARREGAR ========================================================= */ iframe.addEventListener("load", function () { setTimeout(() => { loadingScreen.classList.add("hidden"); }, 500); }); /* ========================================================= ATUALIZAR PLANILHA ========================================================= */ function refreshSpreadsheet() { refreshButton.classList.add("loading"); loadingScreen.classList.remove("hidden"); iframe.src = iframe.src; setTimeout(() => { refreshButton.classList.remove("loading"); loadingScreen.classList.add("hidden"); showStatus(); }, 1800); } /* ========================================================= MENSAGEM DE STATUS ========================================================= */ function showStatus() { status.classList.add("show"); setTimeout(() => { status.classList.remove("show"); }, 1800); } /* ========================================================= SERVICE WORKER ========================================================= */ if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker .register("./service-worker.js") .then(registration => { console.log( "Service Worker registrado:", registration.scope ); }) .catch(error => { console.error( "Erro ao registrar Service Worker:", error ); }); }); } </script> </body> </html>
